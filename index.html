<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guild Camp System - Select Guild</title>
  
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Google Fonts: Kanit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Tailwind CSS Framework -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Tailwind Configuration สำหรับ Gaming Theme -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              red: '#ff2a2a',      
              orange: '#ff6b00',   
              yellow: '#ffc107',
              gamebg: '#0b0f19', 
              gamecard: '#151b2b',
              gameborder: '#232b3e'
            }
          },
          fontFamily: {
            sans: ['Kanit', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Custom CSS -->
  <style>
    body { font-family: 'Kanit', sans-serif; } 
    
    .screen { display: none; opacity: 0; transition: opacity 0.3s ease; }
    .screen.active { display: block; opacity: 1; animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
      padding: 12px 24px; border-radius: 12px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 999; pointer-events: none;
      background: #151b2b; color: #f8fafc; border: 1px solid #232b3e;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    .guild-scroll-wrap { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
      gap: 1.5rem; 
      margin-top: 1rem; 
      padding-bottom: 2rem;
    }

    .guild-big-card {
      background: #151b2b;
      border: 1px solid #232b3e;
      border-radius: 1.25rem;
      padding: 1.5rem;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      color: #f1f5f9; 
    }
    
    .guild-big-card:hover { 
      transform: translateY(-5px); 
      border-color: rgba(255, 107, 0, 0.5);
      box-shadow: 0 15px 30px -5px rgba(255, 107, 0, 0.2); 
    }

    .guild-big-name { color: #ffffff !important; }
    .guild-big-card .text-muted, .guild-big-card [style*="color:var(--muted)"] { color: #94a3b8 !important; }
    .guild-big-card.locked { opacity: 0.5; cursor: not-allowed; filter: grayscale(50%); }
    .guild-big-card.mine { border: 2px solid #ff6b00; background: #1a1512; box-shadow: inset 0 0 20px rgba(255, 107, 0, 0.05); }

    .level-badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 99px; font-size: 0.75rem; font-weight: 700; background: rgba(255,255,255,0.05); color: #cbd5e1; border: 1px solid rgba(255,255,255,0.1); }
    .guild-member-chip { background: rgba(255,255,255,0.05); border-radius: 8px; padding: 4px 10px; font-size: 0.8rem; font-weight: 600; color: #cbd5e1; display: inline-flex; align-items: center; gap: 4px; border: 1px solid rgba(255,255,255,0.05); }
    .guild-member-chip.leader-chip { background: rgba(255, 107, 0, 0.1); color: #ff6b00; border-color: rgba(255, 107, 0, 0.2); }
    .badge { display: inline-flex; align-items: center; gap: 4px; border-radius: 8px; padding: 4px 10px; font-size: 0.75rem; font-weight: 700; }
    .badge-unity { background: rgba(3, 105, 161, 0.2); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
    .badge-roblox { background: rgba(194, 65, 12, 0.2); color: #fb923c; border: 1px solid rgba(251, 146, 60, 0.3); }
    .badge-webapp { background: rgba(21, 128, 61, 0.2); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.3); }
  </style>
</head>

<body class="bg-brand-gamebg text-slate-200 transition-colors duration-300 min-h-screen relative overflow-x-hidden" 
      style="background-image: url('image/bg.png'); background-size: cover; background-position: center; background-repeat: repeat; background-attachment: fixed;">
  
  <div class="fixed inset-0 bg-brand-gamebg/95 z-0 pointer-events-none"></div>

  <div id="app" class="relative z-10 w-full max-w-5xl mx-auto px-4 sm:px-6 py-6 min-h-screen flex flex-col">
    

    <div id="screen-guild-select" class="screen active flex-grow">
      

      <div class="w-full bg-brand-gamecard/80 backdrop-blur-md border border-brand-gameborder rounded-2xl p-4 shadow-lg mb-8 flex justify-between items-center relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-brand-red via-brand-orange to-brand-yellow"></div>
        
        <div class="font-extrabold text-lg flex items-center gap-3">
          <img src="image/logo.png" alt="Logo" class="w-16 sm:w-20 h-auto object-contain drop-shadow-md" />
          <span class="text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-400 hidden sm:inline-block">Hamster Guild</span>
        </div>
        
        <div class="flex items-center gap-4">
          <span class="text-sm font-semibold text-brand-orange" id="nav-username"></span>
          <button class="py-2.5 px-5 bg-white/5 hover:bg-brand-red text-slate-300 hover:text-white font-bold rounded-xl transition-all duration-300 flex items-center gap-2 text-xs border border-white/10 hover:border-brand-red shadow-sm" onclick="logout()">
            <i class="fa-solid fa-arrow-right-from-bracket"></i> ออก
          </button>
        </div>
      </div>


      <div id="my-guild-banner" style="display:none;" class="bg-blue-900/20 border border-blue-500/30 text-blue-300 rounded-xl p-4 text-sm font-semibold flex items-center gap-3 mb-6"></div>
      
      <div class="flex justify-between items-end mb-6">
        <div class="text-2xl font-extrabold text-white drop-shadow-sm flex items-center gap-3">
          <i class="fa-solid fa-chess-rook text-brand-orange"></i> เลือกกิลด์
        </div>
        <button class="py-2.5 px-6 bg-gradient-to-r from-brand-red to-brand-orange hover:brightness-110 text-white font-bold rounded-xl shadow-lg hover:-translate-y-0.5 active:scale-[0.98] transition-all duration-300 flex items-center gap-2 text-sm" onclick="showScreen('screen-create-guild')">
          <i class="fa-solid fa-plus"></i> สร้างกิลด์ใหม่
        </button>
      </div>
      
      <div id="guild-list-select" class="guild-scroll-wrap"></div>
    </div>

    <div id="screen-create-guild" class="screen flex-grow">
      

      <div class="w-full bg-brand-gamecard/80 backdrop-blur-md border border-brand-gameborder rounded-2xl p-4 shadow-lg mb-8 flex justify-between items-center relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-brand-red via-brand-orange to-brand-yellow"></div>
        
        <button class="py-2.5 px-5 bg-white/5 hover:bg-white/10 text-slate-300 hover:text-white font-bold rounded-xl transition-all duration-300 flex items-center gap-2 text-xs border border-white/10" onclick="showScreen('screen-guild-select')">
          <i class="fa-solid fa-arrow-left-long"></i> ย้อนกลับ
        </button>
        <div class="font-extrabold text-lg text-white">สร้างกิลด์</div>
        <div class="w-24"></div> 
      </div>
      

      <div class="w-full max-w-lg mx-auto bg-brand-gamecard border border-brand-gameborder rounded-[2rem] p-8 sm:p-10 shadow-2xl relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-brand-red via-brand-orange to-brand-yellow"></div>

        <div class="text-[0.85rem] font-bold text-brand-orange uppercase tracking-wider mb-6 flex items-center gap-2">
          <i class="fa-solid fa-hammer text-lg"></i> สร้างกิลด์ใหม่
        </div>
        

        <div class="bg-indigo-900/40 border border-indigo-500/50 text-indigo-100 rounded-xl p-4 text-sm font-medium flex items-start gap-3 mb-6 shadow-inner">
          <i class="fa-solid fa-lightbulb mt-0.5 text-brand-yellow"></i> 
          ประเภทโปรเจกต์ (Unity / Roblox / WebApp) จะกำหนดตอนสร้างกลุ่มย่อย ไม่ใช่ที่กิลด์
        </div>
        
        <div class="mb-5">
          <label class="block text-sm font-semibold text-slate-200 mb-3">ชื่อกิลด์</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <i class="fa-solid fa-shield-halved text-slate-400"></i>
            </div>

            <input id="new-guild-name" type="text" placeholder="ตั้งชื่อกิลด์สุดเท่…" class="w-full pl-12 pr-4 py-3.5 bg-slate-800/60 border border-slate-600/50 rounded-2xl text-white placeholder-slate-400 text-base shadow-inner focus:bg-slate-800 focus:outline-none focus:border-brand-orange focus:ring-1 focus:ring-brand-orange transition-all duration-300" />
          </div>
        </div>

        <div class="mb-8">
          <label class="block text-sm font-semibold text-slate-200 mb-3">คำอธิบาย (ไม่บังคับ)</label>
          <div class="relative">
            <div class="absolute top-4 left-0 pl-4 flex items-center pointer-events-none">
              <i class="fa-solid fa-align-left text-slate-400"></i>
            </div>

            <textarea id="new-guild-desc" placeholder="อธิบายกิลด์ของคุณสั้นๆ…" class="w-full pl-12 pr-4 py-3.5 bg-slate-800/60 border border-slate-600/50 rounded-2xl text-white placeholder-slate-400 text-base shadow-inner min-h-[120px] resize-y focus:bg-slate-800 focus:outline-none focus:border-brand-orange focus:ring-1 focus:ring-brand-orange transition-all duration-300"></textarea>
          </div>
        </div>
        
        <button onclick="createGuild()" class="w-full py-4 px-4 bg-gradient-to-r from-brand-red to-brand-orange hover:brightness-110 text-white font-bold rounded-2xl shadow-lg hover:-translate-y-0.5 active:scale-[0.98] transition-all duration-300 flex justify-center items-center gap-2 text-lg">
          <i class="fa-solid fa-wand-magic-sparkles"></i> ก่อตั้งกิลด์
        </button>
      </div>
    </div>

  </div>

  <div id="toast"></div>

  <button id="theme-toggle" onclick="toggleTheme()" class="hidden"></button>

  <script type="module" src="js/main.js"></script>
</body>
</html>
