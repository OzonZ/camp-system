<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guild Camp System - Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Tailwind CSS Framework -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Tailwind Configuration -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              red: '#dc2626',
              yellow: '#fbbf24',
              orange: '#f97316',
              darkbg: '#0f0f0f', 
            }
          },
          fontFamily: {
            sans: ['Kanit', 'sans-serif'],
          },
          animation: {
            'float': 'float 3s ease-in-out infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-12px)' },
            }
          }
        }
      }
    }
  </script>


  <style>
    body { font-family: 'Kanit', sans-serif; } 

    .screen { display: none; opacity: 0; transition: opacity 0.3s ease; }
    .screen.active { display: flex; flex-direction: column; align-items: center; opacity: 1; animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }


    #toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
      padding: 12px 24px; border-radius: 12px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 999; pointer-events: none;
      background: white; color: #111827; border: 1px solid #e5e7eb;
    }
    .dark #toast { background: #2d2d2d; color: #f3f4f6; border-color: #404040; }
    #toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>

<body class="bg-[#FCD148] text-slate-900 dark:text-slate-100 transition-colors duration-300 min-h-screen flex items-center justify-center relative overflow-hidden" 
      style="background-image: url('image/bg.png'); background-size: cover; background-position: center; background-repeat: repeat;">
  

  <div class="absolute inset-0 bg-black/0 dark:bg-brand-darkbg/95 transition-colors duration-300 z-0"></div>


  <div id="app" class="relative z-10 w-full max-w-md px-4 sm:px-6">
    

    <div id="screen-login" class="screen active w-full">
      

      <div class="text-center mb-8">
        <div class="inline-block relative mb-3">
          <img src="image/logo.png" alt="Hamster Hub Logo" class="w-64 h-auto object-contain drop-shadow-xl animate-float" />
        </div>
        
        <h1 class="text-4xl font-extrabold text-slate-800 dark:text-white tracking-tight drop-shadow-md">
          Hamster <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-red to-brand-orange">Guild</span>
        </h1>
        <p class="text-slate-700 dark:text-slate-400 text-[0.8rem] mt-2 tracking-[0.25em] font-semibold uppercase drop-shadow-sm">
          Made by NSC 2026
        </p>
      </div>

      <div class="w-full bg-white/95 dark:bg-[#FCD148]/95 backdrop-blur-xl border border-white/50 dark:border-[#FCD148]/50 rounded-[2rem] p-8 sm:p-10 shadow-[0_20px_50px_-12px_rgba(0,0,0,0.25)] dark:shadow-[0_20px_50px_-12px_rgba(0,0,0,0.6)] relative overflow-hidden transition-colors duration-300">

        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-brand-red via-brand-orange to-brand-yellow dark:from-slate-900 dark:via-slate-800 dark:to-slate-900 transition-colors"></div>

        <div class="text-[0.85rem] font-bold text-brand-red dark:text-slate-900 uppercase tracking-wider mb-6 flex items-center gap-2">
          <i class="fa-solid fa-right-to-bracket text-lg"></i> เข้าสู่ระบบ
        </div>
        
        <div class="mb-6">
          <label class="block text-sm font-semibold text-slate-700 dark:text-slate-800 mb-3">ชื่อเล่น หรือ ชื่อจริง</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">

              <i class="fa-solid fa-user text-slate-400 dark:text-slate-600"></i>
            </div>

            <input id="login-name" type="text" placeholder="พิมพ์ชื่อของคุณที่นี่..." 
              onkeydown="if(event.key==='Enter')loginUser()" 
              class="w-full pl-12 pr-4 py-3.5 bg-slate-50 dark:bg-white/40 border border-slate-200 dark:border-slate-900/20 rounded-2xl text-slate-900 dark:text-slate-900 dark:placeholder-slate-600 text-base shadow-inner focus:bg-white dark:focus:bg-white/90 focus:outline-none focus:ring-4 focus:ring-brand-red/20 dark:focus:ring-slate-900/20 focus:border-brand-red dark:focus:border-slate-900 transition-all duration-300" />
          </div>
        </div>
        
        <button onclick="loginUser()" class="w-full py-4 px-4 bg-gradient-to-r from-brand-red to-brand-orange hover:from-brand-red hover:to-brand-yellow text-white font-bold rounded-2xl shadow-lg shadow-brand-red/20 hover:-translate-y-1 hover:shadow-brand-red/40 active:scale-[0.98] transition-all duration-300 flex justify-center items-center gap-2 text-lg">
          <i class="fa-solid fa-fire"></i> เริ่มต้นการผจญภัย
        </button>
        
        <div class="flex items-center my-7">
          <div class="flex-grow border-t border-slate-200 dark:border-slate-900/10"></div>
          <span class="flex-shrink-0 mx-4 text-slate-400 dark:text-slate-700 text-xs font-bold uppercase tracking-widest">หรือ</span>
          <div class="flex-grow border-t border-slate-200 dark:border-slate-900/10"></div>
        </div>
        

        <button onclick="showScreen('screen-admin-pw')" class="w-full py-3.5 px-4 bg-slate-50 dark:bg-transparent border border-slate-200 dark:border-slate-900/30 hover:bg-slate-100 dark:hover:bg-slate-900 hover:border-brand-red/40 dark:hover:border-slate-900 text-slate-600 dark:text-slate-800 hover:text-brand-red dark:hover:text-white font-bold rounded-2xl transition-all duration-300 flex justify-center items-center gap-2 text-sm">
          <i class="fa-solid fa-user-shield"></i> เข้าสู่ระบบ Admin
        </button>
      </div>
    </div>

    <div id="screen-admin-pw" class="screen w-full">
      <div class="text-center mb-8">
        <i class="fa-solid fa-user-shield text-6xl text-slate-800 dark:text-slate-300 drop-shadow-lg animate-float mb-4"></i>
        <div class="text-4xl font-extrabold text-slate-800 dark:text-white tracking-tight drop-shadow-md">
          System <span class="text-brand-red">Admin</span>
        </div>
      </div>
      
      <div class="w-full bg-white dark:bg-[#FCD148]/95 backdrop-blur-xl border border-white/50 dark:border-[#FCD148]/50 rounded-[2rem] p-8 sm:p-10 shadow-[0_20px_50px_-12px_rgba(0,0,0,0.25)] dark:shadow-[0_20px_50px_-12px_rgba(0,0,0,0.6)] relative overflow-hidden transition-colors duration-300">
        <div class="absolute top-0 left-0 w-full h-2 bg-slate-800 dark:bg-brand-red"></div>

        <div class="text-[0.85rem] font-bold text-slate-700 dark:text-slate-900 uppercase tracking-wider mb-6 flex items-center gap-2">
          <i class="fa-solid fa-lock text-lg"></i> รหัสผ่านผู้ดูแลระบบ
        </div>
        
        <div class="mb-8">
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <i class="fa-solid fa-key text-slate-400 dark:text-slate-600"></i>
            </div>
            <input id="admin-pw-input" type="password" placeholder="••••••••" 
              onkeydown="if(event.key==='Enter')checkAdminPw()" 
              class="w-full pl-12 pr-4 py-3.5 bg-slate-50 dark:bg-white/40 border border-slate-200 dark:border-slate-900/20 rounded-2xl text-slate-900 dark:text-slate-900 dark:placeholder-slate-600 text-lg shadow-inner focus:bg-white dark:focus:bg-white/90 focus:outline-none focus:ring-4 focus:ring-slate-800/20 dark:focus:ring-slate-900/20 focus:border-slate-800 dark:focus:border-slate-900 transition-all duration-300" />
          </div>
        </div>
        
        <button onclick="checkAdminPw()" class="w-full py-4 px-4 bg-slate-800 hover:bg-slate-900 dark:bg-slate-900 dark:hover:bg-black text-white font-bold rounded-2xl shadow-lg hover:-translate-y-1 active:scale-[0.98] transition-all duration-300 flex justify-center items-center gap-2 text-lg">
          <i class="fa-solid fa-unlock-keyhole"></i> ปลดล็อกระบบ
        </button>
        
        <button onclick="showScreen('screen-login')" class="mt-6 w-full py-2 text-slate-500 hover:text-slate-800 dark:text-slate-700 dark:hover:text-slate-900 font-semibold transition-colors flex justify-center items-center gap-2 text-sm">
          <i class="fa-solid fa-arrow-left-long"></i> ย้อนกลับ
        </button>
      </div>
    </div>
  </div>


  <div id="toast"></div>


  <button id="theme-toggle" onclick="toggleTheme()" title="Toggle Dark/Light Mode" 
    class="fixed bottom-6 right-6 z-50 w-12 h-12 bg-white dark:bg-slate-800 text-slate-800 dark:text-[#FCD148] rounded-full shadow-[0_10px_25px_rgba(0,0,0,0.2)] flex items-center justify-center text-xl hover:scale-110 active:scale-95 transition-all duration-300 border border-slate-100 dark:border-slate-700">
    <i class="fa-solid fa-moon dark:hidden"></i>
    <i class="fa-solid fa-sun hidden dark:block"></i>
  </button>

  <script type="module" src="js/main.js"></script>
</body>
</html>
